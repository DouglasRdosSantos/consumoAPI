<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon_io/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicon_io/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Busca de filmes na OMDb, Pokémon e personagens de Dragon Ball, funcionando até sem internet." />
    <script>
      (function () {
        var salvo = null;
        try { salvo = localStorage.getItem("tema"); } catch (e) {}
        var sistemaEscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = salvo || (sistemaEscuro ? "dark" : "light");
      })();
    </script>
    <title>Consumo de APIs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
